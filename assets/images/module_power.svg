<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="powerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="60%" stop-color="#0072CE"/>
      <stop offset="100%" stop-color="#003F5F"/>
    </linearGradient>
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="powerPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0072CE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base / Circuit Plate -->
  <rect x="30" y="30" width="340" height="220" rx="16" fill="url(#cellGrad)" stroke="#0072CE" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M30 80 H370 M30 140 H370 M30 200 H370 M100 30 V250 M200 30 V250 M300 30 V250" stroke="#0072CE" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.25"/>

  <!-- Battery / Energy Cells Array -->
  <g transform="translate(60, 60)">
    <!-- Cell 1 -->
    <rect x="0" y="0" width="70" height="110" rx="8" fill="#1E3A8A" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="15" y="15" width="40" height="80" rx="4" fill="url(#powerGrad)" opacity="0.3"/>
    <line x1="20" y1="35" x2="50" y2="35" stroke="#00E5FF" stroke-width="2"/>
    <line x1="20" y1="55" x2="50" y2="55" stroke="#00E5FF" stroke-width="2"/>
    <line x1="20" y1="75" x2="50" y2="75" stroke="#00E5FF" stroke-width="2"/>

    <!-- Cell 2 (Active Core) -->
    <rect x="105" y="0" width="70" height="110" rx="8" fill="#1E3A8A" stroke="#00E5FF" stroke-width="2"/>
    <circle cx="140" cy="55" r="28" fill="url(#powerPulse)"/>
    <path d="M142 35 L132 55 L144 55 L138 75" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cell 3 -->
    <rect x="210" y="0" width="70" height="110" rx="8" fill="#1E3A8A" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="225" y="15" width="40" height="80" rx="4" fill="url(#powerGrad)" opacity="0.3"/>
    <line x1="230" y1="35" x2="260" y2="35" stroke="#00E5FF" stroke-width="2"/>
    <line x1="230" y1="55" x2="260" y2="55" stroke="#00E5FF" stroke-width="2"/>
    <line x1="230" y1="75" x2="260" y2="75" stroke="#00E5FF" stroke-width="2"/>
  </g>

  <!-- High-Tech Microcontroller Bus & Pins -->
  <g stroke="#00E5FF" stroke-width="2" stroke-linecap="round">
    <path d="M95 190 L95 215 L200 215 L200 235" fill="none" stroke-opacity="0.8"/>
    <path d="M200 190 L200 235" fill="none"/>
    <path d="M305 190 L305 215 L200 215" fill="none" stroke-opacity="0.8"/>
    <circle cx="200" cy="235" r="4" fill="#00E5FF"/>
  </g>

  <!-- Glowing Status LED -->
  <circle cx="60" cy="48" r="4" fill="#10B981"/>
  <circle cx="75" cy="48" r="4" fill="#00E5FF"/>
  <text x="95" y="52" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">SMART BMS CORE // 99.4% EFFICIENCY</text>
</svg>
