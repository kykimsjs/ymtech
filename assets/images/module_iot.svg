<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="iotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="chipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Module Shield -->
  <rect x="30" y="30" width="340" height="220" rx="16" fill="#0B132B" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.5"/>

  <!-- PCB Circuit Traces -->
  <g stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M50 70 H120 L150 100 V140"/>
    <path d="M50 90 H100 L130 120"/>
    <path d="M350 70 H280 L250 100 V140"/>
    <path d="M350 90 H300 L270 120"/>
    <path d="M120 230 V190 L150 160"/>
    <path d="M280 230 V190 L250 160"/>
    <circle cx="50" cy="70" r="3" fill="#38BDF8"/>
    <circle cx="50" cy="90" r="3" fill="#38BDF8"/>
    <circle cx="350" cy="70" r="3" fill="#38BDF8"/>
    <circle cx="350" cy="90" r="3" fill="#38BDF8"/>
  </g>

  <!-- Central Processor / AI Core -->
  <g transform="translate(145, 85)" filter="url(#chipGlow)">
    <rect x="0" y="0" width="110" height="110" rx="12" fill="#1C2541" stroke="#38BDF8" stroke-width="2"/>
    <rect x="15" y="15" width="80" height="80" rx="8" fill="url(#iotGrad)"/>
    
    <!-- Microchip Pins -->
    <g fill="#38BDF8">
      <rect x="25" y="-6" width="12" height="6" rx="1"/>
      <rect x="50" y="-6" width="12" height="6" rx="1"/>
      <rect x="75" y="-6" width="12" height="6" rx="1"/>
      <rect x="25" y="110" width="12" height="6" rx="1"/>
      <rect x="50" y="110" width="12" height="6" rx="1"/>
      <rect x="75" y="110" width="12" height="6" rx="1"/>
      <rect x="-6" y="25" width="6" height="12" rx="1"/>
      <rect x="-6" y="50" width="6" height="12" rx="1"/>
      <rect x="-6" y="75" width="6" height="12" rx="1"/>
      <rect x="110" y="25" width="6" height="12" rx="1"/>
      <rect x="110" y="50" width="6" height="12" rx="1"/>
      <rect x="110" y="75" width="6" height="12" rx="1"/>
    </g>

    <!-- Wireless Wave Symbols inside chip -->
    <path d="M40 50 A 20 20 0 0 1 70 50" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M47 58 A 10 10 0 0 1 63 58" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="55" cy="68" r="3" fill="#38BDF8"/>
  </g>

  <text x="50" y="52" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#7DD3FC" letter-spacing="1">MODIQ CAN/IoT MESH PROTOCOL</text>
  <circle cx="340" cy="48" r="4" fill="#38BDF8"/>
</svg>
