<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="40%" stop-color="#006E82"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="ecoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#006E82" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Eco Module Shell -->
  <rect x="30" y="30" width="340" height="220" rx="16" fill="#06202A" stroke="#10B981" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Energy Wave Lines -->
  <g stroke="#10B981" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M40 140 Q 100 80, 200 140 T 360 140"/>
    <path d="M40 160 Q 100 100, 200 160 T 360 160"/>
    <path d="M40 120 Q 100 60, 200 120 T 360 120"/>
  </g>

  <!-- Hexagonal Eco Smart Core -->
  <g transform="translate(145, 80)">
    <circle cx="55" cy="60" r="50" fill="url(#ecoGlow)"/>
    <!-- Eco Hexagon Ring -->
    <polygon points="55,10 98,35 98,85 55,110 12,85 12,35" fill="#042F2E" stroke="#34D399" stroke-width="2"/>
    <polygon points="55,22 88,41 88,79 55,98 22,79 22,41" fill="url(#ecoGrad)"/>
    
    <!-- Eco Leaf / Power Synergy Icon -->
    <path d="M55 40 C68 40, 78 52, 75 72 C55 75, 42 68, 42 55 C42 45, 48 40, 55 40 Z" fill="#A7F3D0" opacity="0.9"/>
    <path d="M45 68 Q 55 58, 65 48" stroke="#064E3B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="50" y="52" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#6EE7B7" letter-spacing="1">ZERO EMISSION // ECO ARCHITECTURE</text>
  <circle cx="340" cy="48" r="4" fill="#34D399"/>
</svg>
