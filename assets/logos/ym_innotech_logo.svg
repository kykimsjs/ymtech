<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="ymGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00838F"/>
      <stop offset="35%" stop-color="#006E82"/>
      <stop offset="100%" stop-color="#355BA6"/>
    </linearGradient>
    <linearGradient id="ymGradLight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00A4B4"/>
      <stop offset="100%" stop-color="#006E82"/>
    </linearGradient>
    <linearGradient id="ymGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#264585"/>
      <stop offset="100%" stop-color="#1A3163"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#006E82" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- YM Isometric Hexagon Symbol -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Top Face (Teal Green/Blue) -->
    <polygon points="55,5 100,28 55,52 10,28" fill="url(#ymGradLight)"/>
    
    <!-- Left Face ('Y' structure) -->
    <path d="M10,31 L52,54 L52,105 L32,94 L32,68 L10,54 Z" fill="url(#ymGrad)"/>
    <polygon points="10,58 30,70 30,94 10,82" fill="#244B8A"/>

    <!-- Right Face ('M' ribs structure in perspective) -->
    <path d="M58,54 L100,31 L100,82 L82,92 L82,50 L58,63 Z" fill="url(#ymGradDark)"/>
    <path d="M68,66 L90,53 L90,88 L78,95 L78,74 L68,80 Z" fill="url(#ymGrad)"/>
    <polygon points="55,67 65,61 65,103 55,108" fill="#355BA6"/>
  </g>

  <!-- Typography: YM INNOTECH -->
  <g transform="translate(135, 78)">
    <!-- 'YM' stylized in Pantone 2117 C -->
    <text x="0" y="0" font-family="'Outfit', 'Montserrat', 'Pretendard', sans-serif" font-weight="900" font-style="italic" font-size="44" fill="#355BA6" letter-spacing="-1">YM</text>
    <!-- 'INNOTECH' in Cool Gray 7 C -->
    <text x="76" y="0" font-family="'Outfit', 'Montserrat', 'Pretendard', sans-serif" font-weight="700" font-size="44" fill="#6B7280" letter-spacing="1.5">INNOTECH</text>
    <!-- Korean Subtext -->
    <text x="3" y="24" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-weight="600" font-size="14" fill="#9CA3AF" letter-spacing="3.5">와이엠이노테크</text>
  </g>
</svg>
